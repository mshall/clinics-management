function generic(){let p=state.page;const defs={patients:['Patient registry','Find patients by MRN, national ID, name or phone.'],encounters:['Clinical encounters','Manage draft, active and finalized visits.'],appointments:['Appointment list','Status, availability and clinician scheduling.'],operations:['Operations and procedures','Manage procedures, clinical operations, statuses and revenue.'],clinics:['Clinics and branches','Parent clinics, branches and organizational hierarchy.'],expenses:['Expenses','Track transactions, categories and proof documents.'],revenue:['Revenue and invoices','Collections, visit fees, invoices and receipts.'],hr:['HR and workforce','Staff, attendance, leave and payroll.'],reports:['Reports and analytics','Reporting periods, trends and operational summaries.'],support:['Customer support','Ticket resolution, priorities, internal assignments.'],admin:['Organization administration','Tenant settings, RBAC, feature flags and governance.'],platform:['Platform overview','Multi-organization SaaS operations.'],organizations:['Organizations','Tenant onboarding, lifecycle and controls.'],markets:['Market configurations','Market packs, currencies and deployment regions.'],integrations:['Integration clients','API clients, permissions, webhooks and health.'],profile:['My profile and MFA','Account details and security.'],guide:['User guide','Role-focused navigation and help.'],login:['Sign in','Access your clinic workspace securely.']};let [name,description]=defs[p]||[(items.find(x=>x[1]===p)||[])[0]||'Workspace','Review and manage the corresponding Kiorly workflow.'];let content='';

else if(p==='appointments')content=card('Today’s appointments',appointmentTable(),'Day · Week · List');
else if(p==='encounters')content=card('Encounter list',table(['Patient','Service','Date','Status',''],patients.map((x,i)=>[x[0],['Consultation','Follow-up','Procedure'][i%3],x[4],`<span class="tag ${i%2?'warn':'ok'}">${i%2?'Draft':'Finalized'}</span>`,`<button class="smallbutton" onclick="setPage('encounter')">Open</button>`])));
else if(p==='operations')content=`<div class="grid metrics">${metric('Scheduled','24')}${metric('In progress','6')}${metric('Completed','18')}${metric('Operations revenue','AED 9,250')}</div>${card('Procedures',list([['Minor procedure · Ahmed Hassan','Room A · Dr. Rahman','Scheduled'],['Follow-up procedure · Sara Mahmoud','Room C · Dr. Omar','Active'],['Procedure · Lina Hassan','Completed today','Completed']]))}`;
else if(p==='clinics'||p==='platform-clinics')content=card('Clinic directory',list([['Main clinic','Dubai · 8 physicians','Active'],['Downtown clinic','Dubai · 6 physicians','Active'],['Marina clinic','Dubai · 4 physicians','Active'],['New branch','Pending activation','Pending']]));
else if(p==='revenue'||p==='doctor-revenue'||p==='expenses'||p==='reports'||p==='insights')content=finance();
else if(p==='hr'||p==='employee'||p==='employee-profile')content=card('Workforce',table(['Employee','Role','Branch','Attendance','Status'],[['Dr. Rahman','Physician','Main','On duty','Active'],['Dr. Salma','Physician','Downtown','On duty','Active'],['Nurse Nina','Nurse','Main','On duty','Active'],['Omar Hassan','Reception','Main','Leave','Active']].map(x=>[...x.slice(0,4),'<span class="tag ok">Active</span>'])));
else if(p==='integrations'||p==='failures')content=card('Integrations and governance',list([['Kiorex Marketplace','Appointment booking and patient provisioning','Connected'],['Webhook subscriptions','Delivery history and retry queue','Active'],['Integration failures','Governed failures and remediation','Pending'],['API credentials','Tenant-scoped access and permissions','Active']]));
else if(p==='patients'||p==='platform-users'||p==='users')content=card('User directory',patientTable());
else if(p==='support')content=card('Support tickets',list([['Ticket #1842 · Appointment cancellation','Assigned to operations','Open'],['Ticket #1841 · Invoice question','Awaiting clinic response','Pending'],['Ticket #1839 · Patient merge request','Resolved','Completed']]));
else if(p==='templates')content=card('Specialty templates',list([['General medicine · SOAP','Arabic / English templates','Active'],['Dermatology consultation','Specialty form','Active'],['Physiotherapy assessment','Specialty form','Active']]));
else if(p==='waiting-room')content=`<div class="grid three">${metric('Now serving','A-104','')}${metric('Waiting','14','')}${metric('Rooms occupied','3 / 8','')}</div><div style="height:20px"></div>${card('Waiting room display',list([['A-105 · Sara Mahmoud','Please proceed to Room 3','Next'],['A-106 · Omar Khaled','Please wait for your ticket','Waiting']]))}`;
else if(p==='front-desk')content=`<div class="grid metrics">${metric('Waiting','14','')}${metric('In consultation','8','')}${metric('Rooms available','5','')}${metric('Average wait','12 min','')}</div>${card('Live queue',queueTable(),'Auto-refresh')}<p class="sectioncaption">Quick check-in opens a draft encounter and assigns the daily queue ticket; room assignment occurs on Start visit.</p>`;
else if(p==='prescriptions')content=card('Medication & prescription draft',list([['Amlodipine 5 mg','Once daily · 30 days','Draft'],['Paracetamol 500 mg','As needed · 5 days','Draft'],['Omeprazole 20 mg','Once daily · 14 days','Draft']])+`<div class="alert">Medication-interaction checks must be based on validated clinical data, not illustrative statuses.</div>${btn('Review & issue',true)}`);
else if(p==='patient-merge')content=card('Patient merge wizard',textFields(['Source MRN','Destination MRN'])+`<div class="alert">This is a sensitive action requiring clinical authorization and an immutable audit record.</div>${btn('Review merge',true)}`);
else if(p==='invoice-preview')content=card('Invoice preview',table(['Description','Qty','Amount'],[['General consultation','1','AED 120'],['Lab test','1','AED 85'],['Total','','AED 205']])+`<div style="height:16px"></div>${btn('Export PDF')}`);
else if(p==='appointment-detail')content=card('Appointment · Ahmed Hassan',list([['09:00 AM · Apr 28','Dr. Rahman · General medicine','Confirmed'],['Clinic','Main clinic · Room assignment pending',''],['Visit fee','AED 120 · Not yet collected','']])+`<div style="height:18px"></div><div class="actions">${btn('Cancel')}${btn('Check in & create encounter',true)}</div>`);
else if(p==='clinic-detail'||p==='admin'||p==='profile'||p==='flags'||p==='governance'||p==='markets'||p==='organizations'||p==='platform'||p==='platform-users')content=card(name,list([['General','Organization name, language, currency and timezone',''],['Clinics and branches','Hierarchy, rooms and operating hours',''],['Users & permissions','RBAC, user grants, access restrictions',''],['Integrations','Credentials, webhooks and payment channels',''],['Audit & governance','Events, retention, failed integrations','']]));
else if(p==='documents')content=card('Clinical documents',list([['CBC result','Laboratory document · Apr 20, 2026','Available'],['Chest X-ray','Imaging · Apr 10, 2026','Available'],['Consultation summary','Clinical letter · Apr 1, 2026','Available']]));
else if(p==='new-appointment'||p==='add-patient')content=card(name,textFields(p==='add-patient'?['Full name','Phone number','National ID','Date of birth']:['Patient','Clinician','Clinic','Date & time'])+btn('Save',true));
else if(p==='empty')content=card('No appointments',`<div class="empty"><div class="big">▦</div><h2>Nothing scheduled yet</h2><p>Start with a new appointment for your patient.</p>${btn('New appointment',true)}</div>`);
else if(p==='confirm')content=card('Confirm action',`<div class="empty"><div class="big">✓</div><h2>Ready to continue?</h2><p>Critical clinical and financial actions require explicit confirmation.</p>${btn('Cancel')} ${btn('Confirm',true)}</div>`);
else if(p==='login')content=card('Welcome back',textFields(['Email','Password'])+btn('Sign in',true));
else content=card(name,list([['Overview',description,''],['Recent activity','Latest updates and transactions',''],['Manage','Open configuration and detailed tools','']]));
return content}
function build(){let p=state.page;if(p==='dashboard')return dashboard();if(p==='calendar')return calendarPage();if(p==='patient'||p==='timeline')return patient();if(p==='encounter')return clinical();return generic()}
const title=()=>({dashboard:'Dashboard',calendar:'Appointment calendar',patient:'Patient 360',encounter:'Clinical encounter','front-desk':'Front desk · Live queue','waiting-room':'Waiting room display','appointment-detail':'Appointment details'}[state.page]||(items.find(x=>x[1]===state.page)||['Dashboard'])[0]);
function sidebarNav(){return groups.map(g=>`<div class="section-label">${g[0]}</div>`+g[1].map(([n,k,icon])=>`<button class="nav ${state.page===k?'active':''}" onclick="setPage('${k}')" title="${n}"><span class="navicon">${icon}</span><span class="navtext">${n}</span></button>`).join('')).join('')}
function render(){document.documentElement.classList.toggle('dark',state.dark);let layout=`<div class="app"><aside class="sidebar ${state.collapsed?'collapsed':''}"><div class="brand">${logo()}<div class="brandtext">Kiorly<small>CLINIC OPERATING SYSTEM</small></div></div><div class="navarea">${sidebarNav()}</div><div class="collapsewrap"><button class="collapser" onclick="toggleSide()" title="Toggle sidebar">${state.collapsed?'»':'«'}${state.collapsed?'':' Collapse sidebar'}</button></div></aside><div class="main"><div class="topbar"><button class="iconbtn topmenu" onclick="state.mobileMenu=!state.mobileMenu;render()">☰</button><input class="search" placeholder="⌕  Search patients, appointments, invoices..."/><div class="toptools"><button class="iconbtn" title="Switch theme" onclick="toggleTheme()">${state.dark?'☀':'☾'}</button><button class="iconbtn" onclick="setPage('new-appointment')" title="Create">＋</button><button class="iconbtn" onclick="setPage('support')" title="Notifications">♧</button><div class="avatar">DA</div></div></div>${state.mobileMenu?`<div class="mobilemenu">${sidebarNav()}</div>`:''}<main class="page"><div class="pagehead"><div><div class="eyebrow">Main clinic / ${title()}</div><h1>${title()}</h1><p>Clean, role-aware clinical workflows · Demo content</p></div><div class="actions">${btn('Export')}${btn('＋ New',true)}</div></div>${build()}<div class="screen-footer">Kiorly UI/UX prototype · Concept data only · Screen: ${state.page} · Source coverage: repository routes and feature components · Use real API states for implementation.</div></main></div><nav class="bottomnav">${[['⌂','Home','dashboard'],['▦','Schedule','calendar'],['♙','Patients','patients'],['⋯','More','admin']].map(([i,n,p])=>`<button class="${state.page===p?'selected':''}" onclick="setPage('${p}')"><span>${i}</span>${n}</button>`).join('')}</nav></div>`;root.innerHTML=layout;}
window.addEventListener('hashchange',()=>{state.page=location.hash.slice(1)||'dashboard';render()});render();
</script></body></html>
