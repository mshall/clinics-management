<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiorly — Source Asset Preview</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@600;700&display=swap');
:root{--bg:#f7f9fc;--surface:#fff;--alt:#f1f5fa;--ink:#101827;--sub:#5f6b7c;--line:#e2e8f0;--blue:#2563eb;--shadow:0 2px 10px rgba(0,0,0,.04)}body.dark{--bg:#0e1625;--surface:#172334;--alt:#1e2c40;--ink:#f2f6fb;--sub:#b1bdca;--line:#324258;--blue:#82b1ff;--shadow:none}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px}body.ar{font-family:Tajawal,sans-serif;font-weight:600}body.ar strong,body.ar h1,body.ar h2{font-weight:700}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:72px;background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .18s;flex-shrink:0}.sidebar.open{width:240px}.brand{height:70px;padding:12px;display:flex;align-items:center;gap:9px;white-space:nowrap;overflow:hidden}.brand img{width:42px;height:42px}.brand span{font-size:20px;font-weight:700}.nav{flex:1;overflow-y:auto;padding:8px}.nav button{border:0;background:transparent;color:var(--sub);display:flex;align-items:center;gap:14px;padding:13px;min-height:44px;width:100%;border-radius:12px;text-align:start;margin:2px 0;white-space:nowrap}.nav button.active,.nav button:hover{background:color-mix(in srgb,var(--blue) 11%,transparent);color:var(--blue)}.nav .glyph{width:24px;flex-shrink:0;text-align:center;font-size:20px}.sidebar:not(.open) .label,.sidebar:not(.open) .brand span{display:none}.collapse{margin:8px;border:0;border-top:1px solid var(--line);padding:17px 0;background:transparent;color:var(--ink)}.main{min-width:0;flex:1}.top{height:70px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--surface)}.top input{border:1px solid var(--line);background:var(--bg);border-radius:30px;padding:11px 18px;width:min(420px,50vw);outline:0;color:var(--ink)}.grow{flex:1}.control{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:12px;color:var(--ink)}.content{max-width:1400px;margin:auto;padding:26px}.heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px}h1{font-size:26px;margin:0 0 5px}h2{font-size:16px;margin:0 0 18px}.muted{color:var(--sub)}.small{font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.value{font-size:28px;font-weight:700;margin:12px 0 4px}.trend{color:#14865f}.columns{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}.bars{display:flex;align-items:end;gap:12px;height:180px;border-bottom:1px solid var(--line);padding-top:22px}.bar{flex:1;background:linear-gradient(to top,#2563eb,#96bcff);border-radius:8px 8px 0 0;min-width:10px}.list-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:13px 0;gap:10px}.pill{padding:5px 10px;border-radius:999px;color:#1d4ed8;background:#e8f0ff;font-size:12px;font-weight:600}.primary{border:0;border-radius:11px;background:#2563eb;color:#fff;padding:11px 16px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{min-height:145px;border:1px solid var(--line);border-radius:10px;padding:8px}.event{margin-top:10px;border-radius:7px;background:#e8f0ff;color:#1c4cb0;padding:8px;font-size:11px}.rtl-ind{direction:ltr;unicode-bidi:isolate}.mobile{display:none}.empty{max-width:360px;margin:35px auto;text-align:center}.empty img{width:220px;max-width:100%}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}}@media(max-width:767px){.sidebar{display:none}.mobile{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);z-index:10;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}.mobile button{font-size:12px;background:none;border:0;color:var(--ink);padding:8px}.content{padding:18px 14px 100px}.top{padding:0 14px}.top input{max-width:190px}.cards{gap:10px}.card{padding:14px}.value{font-size:23px}.day{min-height:96px}.calendar{overflow-x:auto}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><img src="branding/svg/kiorly-original.svg" alt="Kiorly"/><span>Kiorly</span></div><nav class="nav" id="nav"></nav><button class="collapse" id="toggle" title="Toggle sidebar" aria-label="Toggle sidebar">⇔</button></aside><div class="main"><header class="top"><strong id="topName">Kiorly</strong><input id="search" aria-label="Search" placeholder="Search views..."/><span class="grow"></span><button class="control" id="lang">AR</button><button class="control" id="theme">☾</button></header><main class="content"><div class="heading"><div><h1 id="title">Dashboard</h1><div class="muted" id="subtitle">Visual component preview · No live patient data</div></div><button class="primary" id="primary">+ New appointment</button></div><div id="view"></div></main></div></div><nav class="mobile" id="mobile"></nav><script>
const routes=[{"name": "Dashboard", "url": "/", "icon": "dashboard", "group": "Core"}, {"name": "Patients", "url": "/patients", "icon": "patients", "group": "Clinical"}, {"name": "Encounters", "url": "/encounters", "icon": "encounters", "group": "Clinical"}, {"name": "Clinical templates", "url": "/clinical/templates", "icon": "document", "group": "Clinical"}, {"name": "Appointments", "url": "/appointments", "icon": "appointments", "group": "Scheduling"}, {"name": "Front desk board", "url": "/front-desk/board", "icon": "frontDesk", "group": "Scheduling"}, {"name": "Waiting room display", "url": "/front-desk/waiting-room", "icon": "waitingRoom", "group": "Scheduling"}, {"name": "Operations", "url": "/operations", "icon": "operations", "group": "Operations"}, {"name": "Clinics", "url": "/clinics", "icon": "clinics", "group": "Operations"}, {"name": "Expenses", "url": "/expenses", "icon": "expenses", "group": "Finance"}, {"name": "Revenue", "url": "/revenue", "icon": "revenue", "group": "Finance"}, {"name": "Doctor revenue", "url": "/doctor-revenue", "icon": "revenue", "group": "Finance"}, {"name": "HR", "url": "/hr", "icon": "hr", "group": "People"}, {"name": "Reports", "url": "/reports", "icon": "report", "group": "Analytics"}, {"name": "Admin", "url": "/admin", "icon": "settings", "group": "Administration"}, {"name": "Support", "url": "/customer-support", "icon": "support", "group": "Administration"}, {"name": "Profile", "url": "/profile", "icon": "profile", "group": "Administration"}, {"name": "Guide", "url": "/guide", "icon": "guide", "group": "Administration"}, {"name": "Platform overview", "url": "/platform", "icon": "platform", "group": "Platform"}, {"name": "Platform markets", "url": "/platform/markets", "icon": "markets", "group": "Platform"}, {"name": "Platform organizations", "url": "/platform/organizations", "icon": "organizations", "group": "Platform"}, {"name": "Platform users", "url": "/platform/users", "icon": "patients", "group": "Platform"}, {"name": "Platform clinics", "url": "/platform/clinics", "icon": "clinics", "group": "Platform"}, {"name": "Platform insights", "url": "/platform/insights", "icon": "report", "group": "Platform"}];
const labelsAr={'Dashboard':'لوحة التحكم','Appointments':'المواعيد','Patients':'المرضى','Encounters':'المقابلات الطبية','Front desk board':'الاستقبال','Waiting room display':'شاشة الانتظار','Reports':'التقارير','Admin':'الإدارة','HR':'الموارد البشرية','Revenue':'الإيرادات','Expenses':'المصروفات','Operations':'العمليات','Clinics':'العيادات','Profile':'الملف الشخصي','Support':'الدعم','Platform overview':'نظرة عامة على المنصة','Platform markets':'الأسواق'};
const icons={dashboard:'⌂',appointments:'▦',patients:'♙',encounters:'♧',frontDesk:'☷',waitingRoom:'▣',report:'▥',settings:'⚙',hr:'♙',revenue:'▥',expenses:'◇',operations:'◈',clinics:'▤',profile:'◉',platform:'◎',support:'☏',guide:'▧',markets:'◎',organizations:'▤',calendar:'▦'};
let current=routes[0];let ar=false; const el=id=>document.getElementById(id);
function getLabel(r){return ar?(labelsAr[r.name]||r.name):r.name}
function renderNav(){el('nav').innerHTML=routes.map((r,i)=>`<button data-id="${i}" class="${current===r?'active':''}" title="${getLabel(r)}"><span class="glyph">${icons[r.icon]||'◈'}</span><span class="label">${getLabel(r)}</span></button>`).join('');el('mobile').innerHTML=[0,1,6,Math.max(0,routes.findIndex(x=>x.name==='Admin'))].map(i=>`<button data-id="${i}">${icons[routes[i].icon]||'◈'}<br>${getLabel(routes[i])}</button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{current=routes[+b.dataset.id];render()});}
function page(){const type=current.group, title=current.name.toLowerCase(); if(title.includes('calendar')||title.includes('appointment'))return `<section class="card"><h2>${ar?'جدول المواعيد':'Appointment calendar'}</h2><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<div class="day"><b>${d}</b>${i<5?`<div class="event">${['09:00 Consult','10:30 Follow-up','14:00 Checkup','11:30 Visit','15:00 Review'][i]}</div>`:''}</div>`).join('')}</div></section>`;if(type==='Clinical'||current.name==='Patients')return `<div class="columns"><section class="card"><h2>${ar?'بيانات المريض':'Patient 360 — Demo'}</h2>${['Overview','History','Allergies','Medications','Documents'].map(x=>`<div class="list-row"><span>${x}</span><span>›</span></div>`).join('')}</section><section class="card"><h2>${ar?'سجل النشاط':'Recent activity'}</h2>${['Consultation','Prescription','Lab result','Follow-up'].map(x=>`<div class="list-row"><span>${x}</span><span class="pill">Demo</span></div>`).join('')}</section></div>`;if(title.includes('report')||title.includes('revenue')||title.includes('insight')||title.includes('expense'))return `<div class="cards">${[['Revenue','$42,300'],['Visits','456'],['Paid','384'],['Outstanding','$2,800']].map(([a,b])=>`<section class="card"><div class="small muted">${a}</div><div class="value">${b}</div></section>`).join('')}</div><section class="card"><h2>Trend</h2>${bars()}</section>`;if(title==='dashboard')return dashboard();if(title.includes('platform')||title.includes('admin')||title.includes('clinic')||title.includes('hr')||title.includes('support')||title.includes('profile'))return `<div class="columns"><section class="card"><h2>${getLabel(current)}</h2>${['Overview','Details','Settings','Activity','Permissions'].map(x=>`<div class="list-row"><span>${x}</span><span>›</span></div>`).join('')}</section><section class="card"><h2>Management</h2><p class="muted">This is an implementation asset preview, not a replacement for the current backend-integrated Kiorly feature screen.</p><button class="primary">View details</button></section></div>`;return `<section class="card"><h2>${getLabel(current)}</h2><div class="list-row"><b>Item</b><b>Status</b></div>${['Item A','Item B','Item C','Item D'].map(x=>`<div class="list-row"><span>${x}</span><span class="pill">Active</span></div>`).join('')}</section>`}
function bars(){return `<div class="bars">${[36,54,49,65,82,72,92,77].map(v=>`<div class="bar" style="height:${v}%"></div>`).join('')}</div>`}
function dashboard(){return `<div class="cards">${[['Appointments','456'],['Patients','862'],['Doctors','12'],['Revenue','$42,300']].map(([a,b])=>`<section class="card"><div class="small muted">${a}</div><div class="value">${b}</div><div class="trend small">↑ +12%</div></section>`).join('')}</div><div class="columns"><section class="card"><h2>${ar?'اتجاه المواعيد':'Appointments trend'}</h2>${bars()}</section><section class="card"><h2>${ar?'مواعيد اليوم':'Today’s schedule'}</h2>${[['09:00','Sara Ali','Waiting'],['09:30','Khalid Ahmed','In Consult'],['10:00','Lina Mustafa','Completed']].map(([time,name,status])=>`<div class="list-row"><small class="rtl-ind">${time}</small><span>${name}</span><span class="pill">${status}</span></div>`).join('')}</section></div>`}
function render(){renderNav();el('title').textContent=getLabel(current);el('subtitle').textContent=ar?'معاينة مكونات التصميم · بيانات تجريبية فقط':'Visual component preview · No live patient data';el('primary').textContent=ar?'+ موعد جديد':'+ New appointment';el('view').innerHTML=page()}
el('toggle').onclick=()=>{let open=el('sidebar').classList.toggle('open');localStorage.setItem('kiorly-example-sidebar',open?'1':'0')};if(localStorage.getItem('kiorly-example-sidebar')==='1')el('sidebar').classList.add('open');el('theme').onclick=()=>{document.body.classList.toggle('dark');el('theme').textContent=document.body.classList.contains('dark')?'☀':'☾'};el('lang').onclick=()=>{ar=!ar;document.body.classList.toggle('ar',ar);document.documentElement.dir=ar?'rtl':'ltr';document.documentElement.lang=ar?'ar':'en';el('lang').textContent=ar?'EN':'AR';render()};el('search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#nav button').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'flex':'none')};el('primary').onclick=()=>alert(ar?'واجهة تجريبية فقط':'UI preview only — connect action to Kiorly API');render();
</script></body></html>
