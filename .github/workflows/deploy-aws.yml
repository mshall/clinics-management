# Deploys the CDK stack (eu-central-1): VPC, RDS, App Runner API, S3 + CloudFront web.
#
# Path-scoped deploys (main pushes):
#   web  — SPA only (S3 + CloudFront); skips API Docker / App Runner
#   api  — API/CDK; restores current SPA from S3 so WebDeploy stays stable
#   full — API + web via CDK (default for mixed / infra / lockfile changes)
#   skip — Docs/cursor-only: CI+deploy jobs are skipped
#
# --- One-time AWS setup (OIDC, recommended) ---
# 1) IAM > Identity providers > Add: provider URL https://token.actions.githubusercontent.com,
#    Audience: sts.amazonaws.com
# 2) IAM > Roles > Create role > Web identity > GitHub > authorize your org/repo.
# 3) Attach a policy that allows CDK deploy (e.g. AdministratorAccess for simplicity, or scoped CDK policy).
# 4) GitHub repo > Settings > Secrets and variables > Actions > New repository secret:
#      Name:  AWS_DEPLOY_ROLE_ARN
#      Value: arn:aws:iam::990597228737:role/GitHubAction-AssumeRole
# 5) Post-deploy cicd-post-deploy-seed.sh invokes DbSeedFn (idempotent demo users on RDS).
# 6) Post-deploy cicd-post-deploy-smoke.sh — /health/ready + demo login (not /health/live alone).
#    See Docs/AWS_Cloud_Deployment_Guide.md.
#
# --- One-time CDK bootstrap (run locally once per account/region) ---
#   npx cdk bootstrap aws://ACCOUNT/eu-central-1

name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_scope:
        description: "Override deploy scope (auto | web | api | full)"
        required: false
        default: auto
        type: choice
        options: [auto, web, api, full]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws-${{ github.ref }}
  # Avoid a stale deploy racing a newer main push.
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1

jobs:
  changes:
    name: Detect deploy scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      api: ${{ steps.scope.outputs.api }}
      web: ${{ steps.scope.outputs.web }}
      infra: ${{ steps.scope.outputs.infra }}
      deploy: ${{ steps.scope.outputs.deploy }}
      run_integration: ${{ steps.scope.outputs.run_integration }}
      run_e2e: ${{ steps.scope.outputs.run_e2e }}
      run_web_build: ${{ steps.scope.outputs.run_web_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: scope
        name: Classify changed paths
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          OVERRIDE: ${{ github.event.inputs.deploy_scope || 'auto' }}
        run: |
          set -euo pipefail
          if [ "${OVERRIDE}" != "auto" ] && [ -n "${OVERRIDE}" ]; then
            case "${OVERRIDE}" in
              web)
                echo "scope=web" >> "$GITHUB_OUTPUT"
                echo "api=false" >> "$GITHUB_OUTPUT"
                echo "web=true" >> "$GITHUB_OUTPUT"
                echo "infra=false" >> "$GITHUB_OUTPUT"
                echo "deploy=true" >> "$GITHUB_OUTPUT"
                echo "run_integration=false" >> "$GITHUB_OUTPUT"
                echo "run_e2e=false" >> "$GITHUB_OUTPUT"
                echo "run_web_build=true" >> "$GITHUB_OUTPUT"
                ;;
              api)
                echo "scope=api" >> "$GITHUB_OUTPUT"
                echo "api=true" >> "$GITHUB_OUTPUT"
                echo "web=false" >> "$GITHUB_OUTPUT"
                echo "infra=false" >> "$GITHUB_OUTPUT"
                echo "deploy=true" >> "$GITHUB_OUTPUT"
                echo "run_integration=true" >> "$GITHUB_OUTPUT"
                echo "run_e2e=true" >> "$GITHUB_OUTPUT"
                echo "run_web_build=true" >> "$GITHUB_OUTPUT"
                ;;
              full)
                echo "scope=full" >> "$GITHUB_OUTPUT"
                echo "api=true" >> "$GITHUB_OUTPUT"
                echo "web=true" >> "$GITHUB_OUTPUT"
                echo "infra=true" >> "$GITHUB_OUTPUT"
                echo "deploy=true" >> "$GITHUB_OUTPUT"
                echo "run_integration=true" >> "$GITHUB_OUTPUT"
                echo "run_e2e=true" >> "$GITHUB_OUTPUT"
                echo "run_web_build=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error::Unknown deploy_scope=${OVERRIDE}"
                exit 1
                ;;
            esac
            echo "Manual override: scope=${OVERRIDE}"
          else
            bash scripts/detect-deploy-scope.sh
          fi
          {
            echo "### Deploy scope"
            echo "- **scope:** \`$(grep '^scope=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)\`"
            echo "- **deploy:** \`$(grep '^deploy=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)\`"
            echo "- **integration:** \`$(grep '^run_integration=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)\`"
            echo "- **e2e:** \`$(grep '^run_e2e=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Full gate (Postgres + optional integration/E2E) for api | full.
  ci_test:
    name: CI test
    needs: changes
    if: ${{ needs.changes.outputs.deploy == 'true' && needs.changes.outputs.scope != 'web' }}
    uses: ./.github/workflows/ci-test-reusable.yml
    with:
      run_integration: ${{ needs.changes.outputs.run_integration == 'true' }}
      run_e2e: ${{ needs.changes.outputs.run_e2e == 'true' }}
      run_web_unit: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.scope == 'full' || needs.changes.outputs.run_e2e == 'true' }}
      run_api_unit: true

  # Web-only: no Postgres / Docker / App Runner — typecheck + web unit only.
  ci_web:
    name: CI web
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'web' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          cache-key-prefix: workspace-web
      - name: Block tracked OpenAI API keys in repo
        run: bash scripts/check-no-openai-secrets-in-git.sh
      - name: Typecheck (web)
        run: npm run typecheck -w web
      - name: Unit tests (web)
        run: npm run test:unit -w web

  deploy:
    needs: [changes, ci_test, ci_web]
    if: |
      always()
      && needs.changes.outputs.deploy == 'true'
      && (needs.ci_test.result == 'success' || needs.ci_test.result == 'skipped')
      && (needs.ci_web.result == 'success' || needs.ci_web.result == 'skipped')
      && !(needs.ci_test.result == 'skipped' && needs.ci_web.result == 'skipped')
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Block tracked OpenAI API keys in repo
        run: bash scripts/check-no-openai-secrets-in-git.sh

      - name: Setup Node.js dependencies (workspace + infra)
        uses: ./.github/actions/setup-node-deps
        with:
          include-infra: ${{ needs.changes.outputs.scope != 'web' && 'true' || 'false' }}
          cache-key-prefix: ${{ needs.changes.outputs.scope == 'web' && 'workspace-web-deploy' || 'workspace-infra' }}

      - name: Check GitHub secret
        run: |
          if [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "::error::Add repository secret AWS_DEPLOY_ROLE_ARN (see workflow header comments)."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Needed for API/full Docker image builds; harmless for web-only.
      - name: Set up Docker Buildx
        if: ${{ needs.changes.outputs.scope != 'web' }}
        uses: docker/setup-buildx-action@v4

      - id: deploy
        name: Deploy (${{ needs.changes.outputs.scope }})
        env:
          CI: true
          DEPLOY_SCOPE: ${{ needs.changes.outputs.scope }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          bash -x scripts/cicd-deploy.sh 2>&1 | tee deploy-full.log
          exit "${PIPESTATUS[0]}"

      - name: Upload full deploy step log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-deploy-full-log
          path: deploy-full.log
          if-no-files-found: warn

      - name: Post-deploy seed (demo users)
        if: ${{ always() && steps.deploy.outcome != 'skipped' && needs.changes.outputs.scope != 'web' }}
        env:
          CI: true
        run: |
          if grep -q 'OK  post-deploy idempotent seed' deploy-full.log 2>/dev/null; then
            echo "Seed already completed inside Deploy step"
            exit 0
          fi
          bash scripts/cicd-post-deploy-seed.sh

      - name: Post-deploy smoke (health + login)
        env:
          CI: true
          SMOKE_LOGIN_EMAIL: ${{ secrets.SMOKE_LOGIN_EMAIL }}
          SMOKE_LOGIN_PASSWORD: ${{ secrets.SMOKE_LOGIN_PASSWORD }}
        run: bash scripts/cicd-post-deploy-smoke.sh

  # Runs only when deploy fails: pulls CFN + App Runner log context into the job log (no auto-fix).
  post_deploy_diagnostics:
    name: Post-failure AWS diagnostics
    needs: [changes, deploy]
    if: ${{ always() && needs.deploy.result == 'failure' }}
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOG_LOOKBACK_MS: "10800000"
      LOG_GROUPS_MAX: "40"
      LINES_PER_GROUP: "280"
      STACK_EVENTS_RECENT: "80"
      LOG_SINCE: "3h"
    steps:
      - uses: actions/checkout@v7

      - name: Download deploy job full log
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: aws-deploy-full-log
          path: .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Collect CloudFormation & CloudWatch diagnostics
        run: bash scripts/cicd-diagnostics-on-failure.sh 2>&1 | tee diagnostics.log

      - name: Append captured deploy log to diagnostics bundle
        if: always()
        run: |
          set -e
          if [ -f deploy-full.log ]; then
            {
              echo ""
              echo "================================================================================"
              echo "FULL DEPLOY JOB LOG"
              echo "================================================================================"
              tail -c 950000 deploy-full.log
            } >> diagnostics.log
          else
            echo "" >> diagnostics.log
            echo "(deploy-full.log artifact missing)" >> diagnostics.log
          fi

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-deploy-diagnostics
          path: diagnostics.log
          if-no-files-found: warn

  cursor_investigate_deploy:
    name: Cursor cloud agent (fix PR, optional)
    needs: [deploy, post_deploy_diagnostics]
    if: ${{ always() && needs.deploy.result == 'failure' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: aws-deploy-diagnostics
          path: .

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (for @cursor/sdk)
        run: |
          NPM_CONFIG_LOGLEVEL=error npm install @cursor/sdk@^1.0.12 --no-save --no-audit --no-fund

      - name: Cursor cloud agent (PR + job summary)
        continue-on-error: true
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_CLOUD_GITHUB_TOKEN: ${{ secrets.CURSOR_CLOUD_GITHUB_TOKEN }}
          DIAGNOSTICS_LOG: diagnostics.log
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cursor-investigate-deploy-failure.mjs
