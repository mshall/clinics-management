name: Deploy (OpenTofu - staging)

# kiorly-clinic -> staging (KX-21 §01). Role: tofu-apply-staging via GitHub Environment `staging`.
# Repository variable required: AWS_TOFU_APPLY_STAGING_ROLE_ARN.
# Flow: ensure ECR -> build/push image (git sha) -> sync web -> tofu apply -> seed (non-prod) -> smoke.
# # enable push/tag triggers after founder approves first deploy
# Nothing here runs automatically: apply workflows are manual until the founder approves the first deploy.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: the selected branch)"
        required: false
  # push:
  #   branches: [kiorex]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  STACK_DIR: infra/tofu/live/staging/frankfurt/kiorly-clinic

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: infra/tofu/.opentofu-version
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TOFU_APPLY_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Is this stack enabled?
        id: gate
        run: |
          if grep -Eq '^enabled_never_matches[[:space:]]*=[[:space:]]*false' "$STACK_DIR/terraform.tfvars"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "Stack disabled in tfvars - nothing to build or apply."
          else echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - name: tofu init
        if: steps.gate.outputs.enabled == 'true'
        run: tofu init -input=false
        working-directory: ${{ env.STACK_DIR }}

      - name: Phase 1 - ensure ECR repositories exist (first deploy only)
        if: steps.gate.outputs.enabled == 'true'
        working-directory: ${{ env.STACK_DIR }}
        run: |
          tofu apply -input=false -auto-approve -var "git_sha=${{ github.sha }}" \
            -target='module.kiorly_clinic.module.container_service.aws_ecr_repository.this' \
            -target='module.kiorly_clinic.module.container_service.aws_ecr_repository.extra'

      - name: Build and push API image (linux/amd64, tag = git sha)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          REPO_URL="$(cd "$STACK_DIR" && tofu output -raw ecr_repository_url)"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO_URL%%/*}"
          docker buildx build --platform linux/amd64 -f apps/api/Dockerfile -t "$REPO_URL:${{ github.sha }}" --push .
          # Non-prod seed Lambda image (only when the stack has a seed repository).
          SEED_URL="$(cd "$STACK_DIR" && tofu output -raw seed_ecr_repository_url 2>/dev/null || true)"
          if [ -n "$SEED_URL" ] && [ -f apps/api/Dockerfile.seed ]; then
            docker buildx build --platform linux/amd64 -f apps/api/Dockerfile.seed -t "$SEED_URL:${{ github.sha }}" --push .
          fi

      - name: Phase 2 - tofu apply
        if: steps.gate.outputs.enabled == 'true'
        working-directory: ${{ env.STACK_DIR }}
        run: tofu apply -input=false -auto-approve -lock-timeout=10m -var "git_sha=${{ github.sha }}"

      - name: Web build and sync
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          WEB_BUCKET="$(cd "$STACK_DIR" && tofu output -raw web_bucket 2>/dev/null || true)"
          DIST_ID="$(cd "$STACK_DIR" && tofu output -raw distribution_id 2>/dev/null || true)"
          if [ -z "$WEB_BUCKET" ] || [ "$WEB_BUCKET" = "null" ]; then echo "No web bucket in this stack"; exit 0; fi
          npm ci --no-audit --no-fund
          npm run build -w web
          aws s3 sync apps/web/dist "s3://$WEB_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*'

      - name: Seed (non-production only)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          FN="$(cd "$STACK_DIR" && tofu output -raw db_seed_function_name 2>/dev/null || true)"
          if [ -n "$FN" ] && [ "$FN" != "null" ]; then
            aws lambda invoke --function-name "$FN" --cli-read-timeout 900 /tmp/seed-out.json && cat /tmp/seed-out.json
          fi

      - name: Smoke (health/ready)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          URL="$(cd "$STACK_DIR" && tofu output -raw app_url)"
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/v1/health/ready" | grep -q '"database"[[:space:]]*:[[:space:]]*"ok"'; then echo "ready"; exit 0; fi
            sleep 10
          done
          echo "::error::health/ready did not report database ok"; exit 1
