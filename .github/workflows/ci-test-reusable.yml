# Reusable quality gate: typecheck, unit tests, DB integration tests (Postgres service).
name: CI test (reusable)

on:
  workflow_call:

jobs:
  ci_test:
    name: CI test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d cms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cms:cms@localhost:5432/cms?schema=public
      CI: "true"
      NODE_ENV: test
      ALLOW_DEMO_SEED: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Block tracked OpenAI API keys in repo
        run: bash scripts/check-no-openai-secrets-in-git.sh

      - name: Install dependencies
        run: NPM_CONFIG_LOGLEVEL=error npm ci --no-audit --no-fund

      - name: Install infra dependencies (not an npm workspace)
        run: NPM_CONFIG_LOGLEVEL=error npm ci --no-audit --no-fund --prefix infra

      - name: Prisma generate
        run: npm run prisma:generate -w api

      - name: Migrate database
        run: npm run db:deploy -w api

      - name: Seed database
        run: npm run db:seed -w api

      - name: Typecheck (api + web)
        run: npm run typecheck

      - name: Unit tests (web)
        run: npm run test:unit -w web

      - name: Unit tests (api)
        run: npm run test:unit -w api

      - name: Infra CDK synth smoke (SC-01)
        working-directory: infra
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          CDK_DEFAULT_ACCOUNT: "111111111111"
        run: |
          npm run build
          npx cdk synth -c hostCell=frankfurt -c deployRegion=eu-central-1 --quiet
          npx cdk synth -c hostCell=cairo -c deployRegion=me-south-1 --quiet

      - name: Unit tests (infra SC-01)
        working-directory: infra
        env:
          GITHUB_ACTIONS: "true"
        run: npm run test:unit

      - name: Integration tests (api)
        run: npm run test:integration -w api