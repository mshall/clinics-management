# Required status check for merging to main (see scripts/apply-github-branch-protection.sh).
name: CI test

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-test-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI test
    uses: ./.github/workflows/ci-test-reusable.yml