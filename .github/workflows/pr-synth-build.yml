# Validates CDK + web build on pull requests (same path as deploy synth, no AWS credentials).
name: PR synth and build

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "infra/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/cicd-deploy.sh"
      - "scripts/cicd-diagnostics-on-failure.sh"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pr-synth-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci_test:
    name: CI test
    uses: ./.github/workflows/ci-test-reusable.yml

  synth-and-build:
    needs: ci_test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js dependencies (workspace + infra)
        uses: ./.github/actions/setup-node-deps
        with:
          include-infra: "true"
          cache-key-prefix: workspace-infra

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: CDK synth (web build + infra synth)
        # infra:synth runs `npm run infra:install` (npm ci --prefix infra). Skip that when
        # infra/node_modules was restored — lockfile-keyed cache already matches.
        run: |
          set -euo pipefail
          npm run build -w web
          if [ ! -d infra/node_modules/aws-cdk-lib ]; then
            npm run infra:install
          fi
          npm run synth --prefix infra
